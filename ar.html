<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Penang Ferry Museum — AR Wall</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #container { position:absolute; inset:0; z-index:0; }
  #container video, #container canvas { position:absolute; top:0; left:0; width:100%; height:100%; }

  #overlay {
    position:absolute; top:0; left:0; right:0; padding:14px 16px;
    display:flex; flex-direction:column; gap:6px; pointer-events:none;
    z-index:20;
  }
  #title { color:#fff; font-size:15px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  #status { color:#e6e6e8; font-size:12.5px; line-height:1.4; max-width:520px; text-shadow:0 1px 4px rgba(0,0,0,.8); }

  #badge {
    position:absolute; top:14px; right:16px; z-index:20;
    background:rgba(0,0,0,0.4); color:#fff; font-size:11px;
    padding:5px 10px; border-radius:999px; backdrop-filter:blur(6px);
  }

  #foundBanner {
    position:absolute; bottom:24px; left:0; right:0; text-align:center;
    z-index:20; pointer-events:none; transition:opacity .3s ease;
  }
  #foundBanner span {
    background:rgba(0,0,0,0.55); color:#fff; font-size:12.5px;
    padding:8px 16px; border-radius:999px; backdrop-filter:blur(6px);
  }

  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:#fff; background:#000; z-index:30;
  }
  .spinner {
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.2); border-top-color:#fff;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #errorBox {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:#fff; background:#000; z-index:40;
    padding:24px; text-align:center;
  }

  #unmuteBtn {
    position:absolute; bottom:90px; left:0; right:0; z-index:20;
    display:flex; justify-content:center; pointer-events:none;
  }
  #unmuteBtn button {
    pointer-events:auto;
    background:#fff; color:#111; border:none; border-radius:999px;
    padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.35); display:none;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px; color:#c9c9d1;">Starting camera…</div>
</div>

<div id="errorBox">
  <div style="font-size:15px; font-weight:600;">Couldn't start AR</div>
  <div id="errorMsg" style="font-size:12.5px; color:#c9c9d1; max-width:320px;"></div>
</div>

<div id="container"></div>

<div id="overlay">
  <div id="title">Penang Ferry Museum — AR Wall</div>
  <div id="status">Point your camera at the wall.</div>
</div>

<div id="badge">MindAR · 11 pictures</div>

<div id="foundBanner" style="opacity:0;"><span id="foundBannerText">Target found</span></div>

<div id="unmuteBtn"><button id="unmuteBtnInner">🔊 Tap for sound</button></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { MindARThree } from "mindar-image-three";

  const TARGET_MIND_URL = "./targets.mind"; // all 11 pictures, compiled together, in order 01-11

  // One entry per picture, in the SAME order the photos were compiled into targets.mind.
  // Photo NN <-> media/NN.mp4. "aspect" = photo width / height, so the video fills the photo exactly.
  const ITEMS = [
    { index: 0, videoUrl: "./media/01.mp4", aspect: 523/683 }, // 01: man and woman by a red car on the bridge
    { index: 1, videoUrl: "./media/02.mp4", aspect: 581/357 }, // 02: two men walking under ceremonial umbrellas
    { index: 2, videoUrl: "./media/03.mp4", aspect: 615/500 }, // 03: smiling man and woman, close-up
    { index: 3, videoUrl: "./media/04.mp4", aspect: 632/499 }, // 04: three uniformed men signing papers
    { index: 4, videoUrl: "./media/05.mp4", aspect: 619/446 }, // 05: crowded shophouse street
    { index: 5, videoUrl: "./media/06.mp4", aspect: 578/355 }, // 06: fighter aircraft with ground crew
    { index: 6, videoUrl: "./media/07.mp4", aspect: 715/472 }, // 07: ferry "Seberang" on the water
    { index: 7, videoUrl: "./media/08.mp4", aspect: 768/967 }, // 08: two men walking through a covered gangway
    { index: 8, videoUrl: "./media/09.mp4", aspect: 447/683 }, // 09: charcoal portrait of a man welcoming visitors
    { index: 9, videoUrl: "./media/10.mp4", aspect: 643/394 }, // 10: greeting on the ferry deck
    { index: 10, videoUrl: "./media/11.mp4", aspect: 496/397 }, // 11: ceremonial parade under an umbrella
  ];

  const loadingEl = document.getElementById('loading');
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');
  const statusEl = document.getElementById('status');
  const foundBanner = document.getElementById('foundBanner');
  const foundBannerText = document.getElementById('foundBannerText');
  const unmuteBtn = document.getElementById('unmuteBtnInner');

  let allVideos = [];
  let audioUnlocked = false;
  unmuteBtn.addEventListener('click', () => {
    audioUnlocked = true;
    allVideos.forEach(v => { v.muted = false; });
    unmuteBtn.style.display = 'none';
  });

  window.addEventListener('error', (e) => {
    const el = document.getElementById('status');
    if (el) el.textContent = 'JS error: ' + (e.message || 'unknown');
  });

  let mindarThree, renderer, scene, camera;
  let activeCount = 0;

  init();

  async function init() {
    try {
      mindarThree = new MindARThree({
        container: document.querySelector("#container"),
        imageTargetSrc: TARGET_MIND_URL,
        uiScanning: "yes",
        uiLoading: "no",
        filterMinCF: 0.0001,
        filterBeta: 0.001,
        missTolerance: 5,
        warmupTolerance: 3,
      });

      renderer = mindarThree.renderer;
      renderer.setClearColor(0x000000, 0);
      scene = mindarThree.scene;
      camera = mindarThree.camera;

      const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1.2);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(0.5, 1, 1);
      scene.add(dir);

      ITEMS.forEach((item, i) => {
        const anchor = mindarThree.addAnchor(item.index);
        const videoPlane = setupVideoPlane(item.videoUrl, item.aspect);
        anchor.group.add(videoPlane.mesh);
        allVideos.push(videoPlane.video);
        if (audioUnlocked) videoPlane.video.muted = false;

        anchor.onTargetFound = () => {
          activeCount++;
          updateStatus();
          flashBanner(`Picture ${i + 1} found`);
          videoPlane.video.play().catch(() => {});
          if (!audioUnlocked) unmuteBtn.style.display = 'block';
        };
        anchor.onTargetLost = () => {
          activeCount = Math.max(0, activeCount - 1);
          updateStatus();
          videoPlane.video.pause();
        };
      });

      await mindarThree.start();
      loadingEl.style.display = 'none';
      updateStatus();

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    } catch (err) {
      loadingEl.style.display = 'none';
      errorBox.style.display = 'flex';
      errorMsg.textContent = err && err.message ? err.message : 'Camera or tracking failed to start.';
    }
  }

  function updateStatus() {
    statusEl.textContent = activeCount > 0
      ? `${activeCount} of ${ITEMS.length} pictures recognized — playing.`
      : `Point your camera at the wall. ${ITEMS.length} pictures set up.`;
  }

  let bannerTimeout;
  function flashBanner(text) {
    foundBannerText.textContent = text;
    foundBanner.style.opacity = '1';
    clearTimeout(bannerTimeout);
    bannerTimeout = setTimeout(() => { foundBanner.style.opacity = '0'; }, 1200);
  }

  // Plane is exactly the size of the printed photo (anchor width = 1, height = 1/aspect).
  // The video is "cover"-fitted onto it: scaled to fill, extra edges cropped, never stretched.
  function setupVideoPlane(videoUrl, photoAspect) {
    const video = document.createElement('video');
    video.src = videoUrl;
    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('webkit-playsinline', 'true');
    video.preload = 'auto';

    const texture = new THREE.VideoTexture(video);
    texture.colorSpace = THREE.SRGBColorSpace || texture.colorSpace;

    const geometry = new THREE.PlaneGeometry(1, 1 / photoAspect);
    const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geometry, material);

    video.addEventListener('loadedmetadata', () => {
      const va = video.videoWidth / video.videoHeight;
      if (va > photoAspect) {            // video is wider: crop left/right
        texture.repeat.set(photoAspect / va, 1);
        texture.offset.set((1 - photoAspect / va) / 2, 0);
      } else {                           // video is taller: crop top/bottom
        texture.repeat.set(1, va / photoAspect);
        texture.offset.set(0, (1 - va / photoAspect) / 2);
      }
    });

    return { mesh, video };
  }
</script>
</body>
</html>

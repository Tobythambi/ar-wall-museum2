<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penang Ferry Museum — AR Wall</title>
<style>
  :root { --amber:#f1c27a; --cream:#fff4e0; --red:#b8341f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#1a1208; }
  body {
    min-height:100%; color:var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    position:relative; isolation:isolate;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    min-height:100svh;
  }
  .bg { position:fixed; inset:0; z-index:-1; background-position:center; background-size:cover;
    background-repeat:no-repeat; transition:opacity 1.6s ease; }
  .bg::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,12,4,.6) 0%, rgba(20,12,4,.4) 40%, rgba(20,12,4,.88) 100%); }
  #bg1 { background-image:url("./bg.jpg"); }
  #bg2 { background-image:url("./bg2.jpg"); opacity:0; }
  body.swap #bg2 { opacity:1; }
  .top { text-align:center; padding-top:8vh; }
  .eyebrow { letter-spacing:.28em; text-transform:uppercase; font-size:12px; color:var(--amber);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  h1 { margin:14px 0 0; font-size:clamp(34px, 9vw, 56px); line-height:1.08; font-weight:700;
    text-shadow:0 2px 18px rgba(0,0,0,.7); }
  .rule { width:56px; height:3px; background:var(--red); margin:18px auto; border-radius:2px; }
  .sub { max-width:340px; margin:0 auto; font-size:16px; line-height:1.5; color:#f3e3c4;
    text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .bottom { text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .btn {
    display:inline-block; text-decoration:none; background:var(--red); color:#fff;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:700; font-size:17px;
    padding:16px 34px; border-radius:999px; box-shadow:0 8px 28px rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.25); width:min(100%, 320px);
  }
  .btn:active { transform:scale(.98); }
  .tips { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-size:12.5px; color:#e9d8b6;
    line-height:1.6; max-width:320px; text-shadow:0 1px 6px rgba(0,0,0,.8); }
</style>
</head>
<body>
  <div class="bg" id="bg1"></div>
  <div class="bg" id="bg2"></div>
  <div class="top">
    <div class="eyebrow">Welcome to the</div>
    <h1>Penang Ferry<br>Museum</h1>
    <div class="rule"></div>
    <p class="sub">Bring the pictures on our wall to life. Point your phone at a photograph and watch its story play.</p>
  </div>
  <div class="bottom">
    <a class="btn" href="./ar.html">Start AR Experience</a>
    <div class="tips">Tap <b>Allow</b> when asked for camera access.<br>Hold your phone steady and fit the whole picture in view.</div>
  </div>
  <script>
    // after 2 seconds, fade from the corridor picture to the ferry picture
    (new Image()).src = "./bg2.jpg";
    setTimeout(function(){ document.body.classList.add("swap"); }, 2000);
  </script>
</body>
</html>
